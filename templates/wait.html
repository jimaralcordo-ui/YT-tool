    <div class="container">

        <div class="card">

                </div>

            </div>


            <!--
                =========================================

            -->

            <div id="countdown">
                5
            </div>


            <!--
                =========================================

                =========================================
            -->

                id="downloadForm"
                action="/download"
                method="POST"
            >

                    type="hidden"

                    id="downloadButton"

                </button>

            </form>

                =========================================
                STATUS MESSAGE

            -->

        </div>

    <script>

        /*
            =========================================
            ELEMENTS
            =========================================
        */

        const countdown =
            document.getElementById(
                "countdown"
            );


        const button =
            document.getElementById(
                "downloadButton"
            );


        const form =
            document.getElementById(
                "downloadForm"
            );


        const title =
            document.getElementById(
                "title"
            );


        const description =
            document.getElementById(
                "description"
            );


        const status =
            document.getElementById(
                "status"
            );


        /*
            =========================================
            COUNTDOWN
            =========================================
        */

        let seconds = 5;


        const timer = setInterval(
            () => {

                seconds--;

                countdown.textContent =
                    seconds;


                if (seconds <= 0) {

                    clearInterval(
                        timer
                    );


                    countdown.textContent =
                        "Ready!";


                    button.style.display =
                        "inline-block";


                    description.textContent =
                        "Your download is ready.";

                }

            },
            1000
        );


        /*
            =========================================
            DOWNLOAD
            =========================================
        */

        form.addEventListener(
            "submit",
            async function(event) {

                /*
                    Prevent normal form submission
                    so we can monitor the download.
                */

                event.preventDefault();


                /*
                    Prevent double-click / spam.
                */

                if (
                    button.disabled
                ) {

                    return;

                }


                /*
                    Disable button immediately.
                */

                button.disabled =
                    true;


                button.innerHTML =
                    '<span class="spinner"></span>Downloading...';


                title.textContent =
                    "Downloading";


                description.textContent =
                    "Please wait while your video is being downloaded.";


                countdown.style.display =
                    "none";


                status.style.display =
                    "none";


                /*
                    Get form data.
                */

                const formData =
                    new FormData(form);


                try {

                    /*
                        Send request to Flask.
                    */

                    const response =
                        await fetch(
                            "/download",
                            {

                                method: "POST",

                                body: formData

                            }
                        );


                    /*
                        Check HTTP status.
                    */

                    if (
                        !response.ok
                    ) {

                        let errorMessage =
                            "Download failed.";


                        try {

                            const errorText =
                                await response.text();


                            if (
                                errorText
                            ) {

                                errorMessage =
                                    errorText;

                            }

                        }
                        catch (
                            error
                        ) {

                            console.error(
                                error
                            );

                        }


                        throw new Error(
                            errorMessage
                        );

                    }


                    /*
                        Convert response to Blob.
                    */

                    const blob =
                        await response.blob();


                    /*
                        Make sure we actually
                        received a file.
                    */

                    if (
                        !blob ||
                        blob.size === 0
                    ) {

                        throw new Error(
                            "The downloader returned an empty file."
                        );

                    }


                    /*
                        Create temporary URL.
                    */

                    const downloadURL =
                        window.URL.createObjectURL(
                            blob
                        );


                    /*
                        Create temporary
                        download link.
                    */

                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        downloadURL;


                    link.download =
                        "video.mp4";


                    document.body.appendChild(
                        link
                    );


                    /*
                        Start browser download.
                    */

                    link.click();


                    /*
                        Remove temporary link.
                    */

                    link.remove();


                    /*
                        Release object URL
                        after a short delay.
                    */

                    setTimeout(
                        () => {

                            window.URL.revokeObjectURL(
                                downloadURL
                            );

                        },
                        1000
                    );


                    /*
                        SUCCESS
                    */

                    title.textContent =
                        "Download Complete";


                    description.textContent =
                        "Your video has been downloaded successfully.";


                    button.style.display =
                        "none";


                    status.className =
                        "success";


                    status.innerHTML =
                        "✓ Download Complete";


                    status.style.display =
                        "block";

                }
                catch (
                    error
                ) {

                    /*
                        ERROR
                    */

                    console.error(
                        "DOWNLOAD ERROR:",
                        error
                    );


                    title.textContent =
                        "Download Failed";


                    description.textContent =
                        "Something went wrong while downloading your video.";


                    button.disabled =
                        false;


                    button.innerHTML =
                        "Try Again";


                    status.className =
                        "failed";


                    status.textContent =
                        "✕ " +
                        (
                            error.message ||
                            "Download failed."
                        );


                    status.style.display =
                        "block";

                }

            }
        );

    </script>


</body>
