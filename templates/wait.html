    <script>

        let seconds = 5;


        const countdown =
            document.getElementById("countdown");


        const button =
            document.getElementById("downloadButton");


        const timer = setInterval(() => {

            seconds--;

            countdown.textContent = seconds;


            if (seconds <= 0) {

                clearInterval(timer);

                countdown.textContent = "Ready!";

                button.style.display = "inline-block";

            }

        }, 1000);

    </script>
