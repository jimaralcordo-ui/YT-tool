<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Video Preview</title>


    <style>

        * {
            box-sizing: border-box;

            margin: 0;

            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #0f172a;

            color: white;

            min-height: 100vh;

            padding: 30px 20px;
        }


        .container {

            max-width: 800px;

            margin: auto;

            text-align: center;
        }


        h1 {

            margin-bottom: 10px;
        }


        .subtitle {

            color: #94a3b8;

            margin-bottom: 25px;
        }


        .video {

            position: relative;

            width: 100%;

            padding-bottom: 56.25%;

            height: 0;

            overflow: hidden;

            border-radius: 15px;

            background: black;
        }


        .video iframe {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            border: none;
        }


        .ad {

            margin: 25px auto;

            height: 120px;

            max-width: 500px;

            border: 1px dashed #475569;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #64748b;
        }


        .back {

            display: inline-block;

            margin-top: 10px;

            padding: 12px 20px;

            background: #ef4444;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>Video Preview</h1>

        <p class="subtitle">
            Your YouTube video was found.
        </p>


        <div class="video">

            <iframe
                src="https://www.youtube.com/embed/{{ video_id }}"
                allowfullscreen>
            </iframe>

        </div>


        <div class="ad">

            ADVERTISEMENT

        </div>


        <a
            href="/"
            class="back"
        >
            ← Back
        </a>

    </div>


</body>

</html>
