```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #0f172a;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card {
            background: #1e293b;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        h1 {
            text-align: center;

            margin-bottom: 10px;
        }

        .status {
            text-align: center;

            color: #22c55e;

            font-weight: bold;

            margin-bottom: 25px;
        }

        .title {
            background: #0f172a;

            padding: 15px;

            border-radius: 9px;

            color: #e2e8f0;

            margin-bottom: 25px;

            word-break: break-word;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;
        }

        select {
            width: 100%;

            padding: 13px;

            background: #0f172a;

            color: white;

            border: 1px solid #475569;

            border-radius: 8px;

            font-size: 15px;
        }

        .continue {
            display: block;

            width: 100%;

            margin-top: 20px;

            padding: 14px;

            background: #2563eb;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            border: none;
        }

        .continue:hover {
            background: #1d4ed8;
        }

        .note {
            text-align: center;

            margin-top: 15px;

            color: #94a3b8;

            font-size: 13px;
        }
    </style>
</head>


<body>

    <div class="container">

        <div class="card">

            <h1>Video Found</h1>

            <div class="status">
                ✓ Video information found
            </div>


            <div class="title">

                <strong>Title:</strong><br>

                {{ title }}

            </div>


            <form action="/wait" method="GET">

                <input
                    type="hidden"
                    name="url"
                    value="{{ url }}"
                >


                <label for="quality">
                    Select quality
                </label>


                <select
                    id="quality"
                    name="quality">

                    <option value="360">
                        360p
                    </option>

                    <option value="480">
                        480p
                    </option>

                    <option value="720">
                        720p HD
                    </option>

                    <option value="1080">
                        1080p Full HD
                    </option>

                </select>


                <button
                    type="submit"
                    class="continue">

                    Continue

                </button>

            </form>


            <p class="note">
                Download availability will be checked before downloading.
            </p>

        </div>

    </div>

</body>

</html>
```
